[package]
name = "tankobon-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tankobon_core"

[features]
default = []
# AVIF decoding needs the system dav1d library.
avif = ["image/avif-native"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
directories = "6.0.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lru = "0.19.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
unrar = "0.5.8"
zip = "9.6.1"

[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }
